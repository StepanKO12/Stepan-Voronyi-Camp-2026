version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: de_user
      POSTGRES_PASSWORD: de_password
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de_user -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl_app:
    build: .
    depends_on:
      postgres_db:
        condition: service_healthy
    volumes:
      - ./data:/app/data